name: pulseflow_flutter
description: >-
  App-side probes for PulseFlow: accurate frame timing, rebuild hotspots with
  source locations, HTTP capture, and memory-leak signals for the PulseFlow
  dashboard.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
