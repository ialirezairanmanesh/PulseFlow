name: pulseflow_bridge
description: >-
  Protocol-compatible Dart bridge that proxies the PulseFlow dashboard to the
  Dart VM Service using package:vm_service.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  args: ^2.5.0
  shelf: ^1.4.0
  shelf_web_socket: ^2.0.0
  vm_service: ^15.0.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
